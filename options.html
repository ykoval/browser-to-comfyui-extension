<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComfyUI Prompt Manager - Settings</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 8px; }
    button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <h1>ComfyUI Prompt Manager Settings</h1>
  <form id="settingsForm">
    <div class="form-group">
      <label for="serverAddress">ComfyUI Server Address:</label>
      <input type="text" id="serverAddress" placeholder="http://127.0.0.1:8188">
    </div>
    <div class="form-group">
      <label for="apiPath">API Path:</label>
      <input type="text" id="apiPath" placeholder="/prompt">
    </div>
    <div class="form-group">
      <label for="workflowId">Workflow ID:</label>
      <input type="text" id="workflowId" placeholder="default_workflow">
    </div>
    <div class="form-group">
      <label for="negativePrompt">Default Negative Prompt:</label>
      <textarea id="negativePrompt" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label for="seed">Default Seed (-1 for random):</label>
      <input type="number" id="seed" value="-1">
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="autoSend"> Auto-send selection to ComfyUI after 'Save as Prompt'
      </label>
    </div>
    <button type="submit">Save Settings</button>
  </form>
  <script type="module" src="dist/options.js"></script>
</body>
</html>
