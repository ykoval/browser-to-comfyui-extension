<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComfyUI Prompt Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="tabs">
      <button class="tab-btn active" data-tab="history">History</button>
      <button class="tab-btn" data-tab="manual">Manual</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <div id="history-tab" class="tab-content active">
      <div class="history-header">
        <div class="auto-send-toggle">
          <label>
            <input type="checkbox" id="autoSendToggle">
            Auto-send selection
          </label>
        </div>
        <button id="clearHistoryBtn" class="icon-btn" title="Clear history">🗑</button>
      </div>
      <div class="auto-detect-toggle">
        <label>
          <input type="checkbox" id="autoDetectToggle">
          <span>Automatic prompt detection on this site</span>
        </label>
        <span id="currentDomain" class="domain-label"></span>
      </div>
      <div class="scan-page-row">
        <button id="scanPageBtn" class="btn-scan">Scan Page</button>
        <button id="togglePasteBtn" class="btn-scan btn-secondary">Paste & Scan</button>
        <span id="scanStatus" class="scan-status"></span>
      </div>
      <div id="pasteArea" class="paste-area hidden">
        <textarea id="pasteInput" placeholder="Paste page content here (Cmd/Ctrl+A to select all on page, then Cmd/Ctrl+C to copy)..."></textarea>
        <button id="scanPasteBtn" class="btn-scan">Scan Pasted Text</button>
      </div>
      <div class="history" id="historyList"></div>
    </div>

    <div id="manual-tab" class="tab-content">
      <div class="manual-prompt">
        <textarea id="promptInput" placeholder="Enter or edit prompt..."></textarea>
        <div class="generation-controls">
          <select id="aspectRatio"></select>
          <input type="number" id="megapixel" value="2.5" min="0.5" max="4" step="0.1" title="Megapixel">
          <input type="number" id="steps" value="20" min="1" max="100" title="Steps">
          <label class="inline-toggle" title="Upscale">
            <input type="checkbox" id="enableUpscale">
            <span>Up</span>
          </label>
        </div>
        <div class="button-row">
          <button id="generateBtn">Generate</button>
          <button id="openInComfyBtn" class="btn-open-comfy" title="Open workflow in ComfyUI for manual editing">Open in ComfyUI</button>
        </div>
      </div>
    </div>

    <div id="settings-tab" class="tab-content">
      <div class="settings-form">
        <div class="form-group">
          <label for="serverAddress">ComfyUI Server:</label>
          <input type="text" id="serverAddress" placeholder="http://192.168.50.143:8188">
        </div>
        <div class="form-group">
          <label for="negativePrompt">Negative Prompt:</label>
          <textarea id="negativePrompt" rows="2" placeholder="dust, dots, stain"></textarea>
        </div>
        <div class="form-group">
          <label for="seed">Seed (-1 = random):</label>
          <input type="number" id="seed" value="-1">
        </div>
        <div class="form-group">
          <label for="cfg">CFG Scale:</label>
          <input type="number" id="cfg" value="4" min="1" max="20" step="0.5">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="enableSeparator" checked>
            Add === separator (for Title/Keywords parsing)
          </label>
        </div>
        <div class="form-group-header">Workflow Manager</div>
        <div class="form-group">
          <label for="workflowSelect">Active Workflow:</label>
          <div class="workflow-select-row">
            <select id="workflowSelect">
              <option value="">Built-in (Qwen T2I)</option>
            </select>
            <button id="importWorkflowBtn" class="btn-icon" title="Import Workflow">+</button>
            <button id="editMappingsBtn" class="btn-icon" title="Edit Mappings">⚙</button>
            <button id="deleteWorkflowBtn" class="btn-icon btn-danger" title="Delete Workflow">🗑</button>
          </div>
          <input type="file" id="workflowFileInput" accept=".json" style="display: none;">
        </div>
        <div id="mappingsPanel" class="mappings-panel hidden">
          <div class="mappings-header">
            <span>Parameter Mappings</span>
            <button id="closeMappingsBtn" class="btn-icon">✕</button>
          </div>
          <div id="mappingsList" class="mappings-list"></div>
          <button id="saveMappingsBtn" class="btn-small">Save Mappings</button>
        </div>
        <div class="form-group-header">Automatic Prompt Detection</div>
        <div class="form-group">
          <label for="promptStartMarker">Prompt Start Marker:</label>
          <input type="text" id="promptStartMarker" placeholder="[PROMPT START]">
        </div>
        <div class="form-group">
          <label for="promptEndMarker">Prompt End Marker:</label>
          <input type="text" id="promptEndMarker" placeholder="[PROMPT END]">
        </div>
        <button id="saveSettingsBtn">Save Settings</button>
        <div id="settingsStatus"></div>
        <div class="build-info">
          <small id="buildTime"></small>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
